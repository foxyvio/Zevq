[package]
name = "zevq_backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "zevq_backend"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zevq-backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
z3 = "0.12"
